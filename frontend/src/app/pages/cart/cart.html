<h2>My Cart</h2>

<table class="table">
  <thead>
    <tr>
      <th>Product</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Total</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let item of cartItems">
      <td>
        {{ item.productName }}
      </td>

      <td>₹{{ item.price }}</td>

      <td>
        {{ item.quantity }}
      </td>

      <td>₹{{ item.subtotal }}</td>
    </tr>
  </tbody>
</table>

<!-- Checkout -->

<div class="d-flex justify-content-end mt-4">
  <a routerLink="/checkout" class="btn btn-dark"> Proceed to Checkout </a>
</div>
