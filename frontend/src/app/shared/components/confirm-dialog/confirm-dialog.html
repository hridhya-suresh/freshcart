<div class="dialog-backdrop">

  <div class="dialog-box">

    <h5 class="mb-3">
      {{ title }}
    </h5>

    <p class="text-muted">
      {{ message }}
    </p>

    <div class="d-flex justify-content-end gap-2 mt-4">

      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="cancel()">

        {{ cancelText }}

      </button>

      <button
        type="button"
        class="btn btn-danger"
        (click)="confirm()">

        {{ confirmText }}

      </button>

    </div>

  </div>

</div>
